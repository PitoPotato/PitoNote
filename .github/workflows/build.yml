name: Build and test
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        shell: pwsh
        run: ./Build.ps1
      - name: Test without installing skins
        shell: pwsh
        run: ./Test.ps1
      - name: Prepare clean packages
        shell: pwsh
        run: ./Release.ps1 -OutputDirectory ./dist/ci
      - name: Upload release candidates
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PitoNote-release-candidate
          path: |
            dist/ci/*.zip
            dist/ci/SHA256SUMS.txt
            dist/ci/MANIFEST.sha256
          if-no-files-found: error
          retention-days: 14
